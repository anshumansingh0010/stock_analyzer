version: '3.8'

services:
  mongodb:
    image: docker.io/library/mongo:latest
    container_name: stocksense-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: stockadmin
      MONGO_INITDB_ROOT_PASSWORD: stockpassword123
      MONGO_INITDB_DATABASE: stock_sense_ai
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:18-alpine
    container_name: stocksense-backend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - MONGODB_URI=mongodb://stockadmin:stockpassword123@mongodb:27017/stock_sense_ai?authSource=admin
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: node:18-alpine
    container_name: stocksense-frontend
    working_dir: /app/client-react
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mongodb_data:
    driver: local
