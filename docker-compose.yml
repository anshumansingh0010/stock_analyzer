version: '3.8'

services:
  mongodb:
    image: docker.io/library/mongo:latest
    container_name: stocksense-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: stockadmin
      MONGO_INITDB_ROOT_PASSWORD: stockpassword123
      MONGO_INITDB_DATABASE: stock_sense_ai
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
